# Builds the offline ByteRush desktop app for Mac (Apple Silicon + Intel) and Windows.
# Push a tag like v1.0.0 to publish a GitHub Release with the downloads; "Run workflow" builds without publishing.
name: Build desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon
            target: --mac --arm64
          - os: macos-15-intel  # Intel Macs
            target: --mac --x64
          - os: windows-latest
            target: --win --x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bundle a small Java (javac + java)
        shell: bash
        run: |
          "$JAVA_HOME/bin/jlink" \
            --add-modules java.base,java.compiler,jdk.compiler,jdk.zipfs,java.logging,java.xml,java.sql \
            --strip-debug --no-man-pages --no-header-files --compress=zip-6 \
            --output desktop/jdk
          ls desktop/jdk/bin

      - name: Build the website
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build the app
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run prepare-server
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ByteRush-${{ matrix.os }}
          path: |
            desktop/dist/ByteRush-*.dmg
            desktop/dist/ByteRush-*.exe
          if-no-files-found: error

      - name: Add to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ByteRush ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            desktop/dist/ByteRush-*.dmg
            desktop/dist/ByteRush-*.exe
